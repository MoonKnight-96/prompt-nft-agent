# Render Blueprint: hosts the server + website on Render's free plan.
# Secrets (sync: false) are entered by hand in the Render dashboard, never committed.
services:
  - type: web
    name: prompt-nft-market
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NETWORK
        value: sepolia
      - key: PUBLIC_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: MASTER_KEY
        sync: false
      - key: RPC_URL
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ASSIST_PER_HOUR
        value: "5"
      - key: ASSIST_PER_DAY
        value: "100"
