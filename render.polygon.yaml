# Render Blueprint for the LIVE Polygon marketplace (operator's own Render account).
# The Sepolia demo keeps using render.yaml. Secrets (sync: false) are entered in the Render dashboard.
services:
  - type: web
    name: prompt-nft-polygon
    runtime: python
    plan: starter            # paid plan: no sleeping
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NETWORK
        value: polygon
      - key: PUBLIC_RPC_URL
        value: https://polygon-rpc.com
      - key: MASTER_KEY          # generated by the operator; back it up offline
        sync: false
      - key: RPC_URL             # operator's Alchemy/Infura Polygon URL (private)
        sync: false
      - key: PINATA_JWT
        sync: false
      - key: PUBLIC_BASE_URL     # e.g. https://www.her-domain.com
        sync: false
      - key: ANTHROPIC_API_KEY   # operator's own key (optional: hides AI assist if blank)
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: OPERATOR_TERMS_URL
        sync: false
      - key: OPERATOR_CONTACT
        sync: false
      - key: WALLETCONNECT_PROJECT_ID   # free public ID from cloud.reown.com; enables QR connect (Safari)
        sync: false
      - key: ASSIST_PER_HOUR
        value: "5"
      - key: ASSIST_PER_DAY
        value: "100"
